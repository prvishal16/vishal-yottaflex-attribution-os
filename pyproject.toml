[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex"
version = "1.0.0"
description = "YottaFlex AI Associate - marketing attribution and ROI analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "duckdb>=1.1,<2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1,<4",
  "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
yottaflex = "yottaflex.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["yottaflex", "yottaflex.generation", "yottaflex.domain", "yottaflex.validation", "yottaflex.api"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["yottaflex"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "frontend", "ground_truth", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
